
services:
  db:
    image: postgres:15-alpine  
    environment:
      POSTGRES_USER: ${DB_USER:-user}   
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-vaultchain}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped  

volumes:
  db_data:  